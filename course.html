<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course — The Skill Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #050A16;
    --cream: #F6F8FC;
    --paper: #F7F5F0;
    --muted: #3E342C;
    --accent: #2D66F5;
    --hue: #E7B84A;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "DM Sans", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 18px; }
  body {
    background: var(--paper);
    color: #1C140C;
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.6;
  }
  a { color: var(--accent); }
  .hero {
    position: relative;
    overflow: hidden;
    background: #07111f;
    color: var(--cream);
    padding: 1.4rem 1.5rem 3.2rem;
    border-bottom: 4px solid var(--hue);
  }
  .hero-glow {
    position: absolute;
    width: 280px;
    height: 280px;
    right: 6%;
    top: -60px;
    background: var(--hue);
    filter: blur(70px);
    opacity: 0.4;
    pointer-events: none;
  }
  .hero-inner, .wrap { max-width: 44rem; margin: 0 auto; position: relative; }
  .nav-row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    align-items: center;
    margin-bottom: 2.2rem;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .nav-row a { color: rgba(246, 248, 252, 0.78); text-decoration: none; }
  .nav-row a:hover { color: #fff; }
  .kicker {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--hue);
    margin-bottom: 0.45rem;
  }
  .hero-row {
    display: flex;
    gap: 1.2rem;
    align-items: flex-start;
  }
  .medal {
    width: 4rem;
    height: 4rem;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #F7F4EE;
    color: #142033;
    border: 2px solid var(--hue);
    flex-shrink: 0;
  }
  .medal svg { width: 1.8rem; height: 1.8rem; }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.2rem, 5vw, 3.3rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; list-style: none; margin-top: 1rem; }
  .chips li {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid rgba(246, 248, 252, 0.28);
    border-radius: 999px;
    padding: 0.28rem 0.6rem;
  }
  .wrap { padding: 2.4rem 1.5rem 4rem; }
  .lead {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.45rem;
    line-height: 1.4;
    margin-bottom: 1.6rem;
  }
  h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.7rem;
    margin: 1.8rem 0 0.55rem;
  }
  .audience { color: var(--muted); }
  .practice { list-style: none; margin-top: 0.4rem; }
  .practice li {
    position: relative;
    padding-left: 1.2rem;
    margin: 0.45rem 0;
  }
  .practice li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--accent);
  }
  .session {
    display: grid;
    grid-template-columns: 2.4rem 1fr;
    gap: 0.8rem;
    padding: 1rem 0;
    border-top: 1px solid rgba(26, 20, 12, 0.12);
  }
  .session:last-child { border-bottom: 1px solid rgba(26, 20, 12, 0.12); }
  .session-num {
    font-family: var(--serif);
    font-style: italic;
    color: var(--accent);
    font-size: 1.15rem;
  }
  .session h3 { font-size: 1rem; font-weight: 500; margin-bottom: 0.2rem; }
  .session p { color: var(--muted); }
  .cta {
    margin-top: 2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem 1.2rem;
    align-items: center;
  }
  .cta a.primary {
    display: inline-flex;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 0.75rem;
    padding: 0.95rem 1.15rem;
  }
  .cta a.primary:hover { background: #1d4ed0; }
  .demo-note {
    margin-top: 1.4rem;
    font-size: 0.85rem;
    color: #6A5E52;
  }
  .next {
    margin-top: 2.4rem;
    padding-top: 1.4rem;
    border-top: 1px solid rgba(26, 20, 12, 0.12);
  }
  .next a { font-family: var(--serif); font-style: italic; font-size: 1.25rem; text-decoration: none; }
  .next a:hover { text-decoration: underline; }
  .choices { list-style: none; margin-top: 1rem; }
  .choices a { display: inline-block; margin: 0.35rem 0; font-size: 1.15rem; }
  .missing { padding: 4rem 1.5rem; max-width: 40rem; margin: 0 auto; }
</style>
</head>
<body>
<main id="root">
  <p class="missing">Opening this stop…</p>
</main>
<script src="courses.js"></script>
<script>
(function () {
  var atlas = window.SKILL_ATLAS;
  var root = document.getElementById("root");
  var params = new URLSearchParams(location.search);
  var id = params.get("id") || location.hash.replace("#", "");
  var courses = atlas.courses;
  var course = courses.filter(function (c) { return c.id === id; })[0];

  if (!course) {
    document.title = "The Skill Atlas — courses";
    var list = courses.map(function (c) {
      return '<li><a href="course.html?id=' + c.id + '">' + c.name + '</a></li>';
    }).join("");
    root.innerHTML =
      '<div class="missing"><p class="kicker">The Skill Atlas</p><h1>Choose a stop.</h1>' +
      '<ul class="choices">' + list + '</ul>' +
      '<p style="margin-top:1.4rem"><a href="atlas.html">Return to the chart</a></p></div>';
    return;
  }

  document.title = course.name + " — The Skill Atlas";
  document.documentElement.style.setProperty("--hue", course.hue);
  var index = courses.indexOf(course);
  var next = courses[(index + 1) % courses.length];

  root.innerHTML =
    '<header class="hero">' +
      '<div class="hero-glow" aria-hidden="true"></div>' +
      '<div class="hero-inner">' +
        '<div class="nav-row">' +
          '<a href="atlas.html#' + course.id + '">← Back to the chart</a>' +
          '<a href="index.html">Portfolio</a>' +
        '</div>' +
        '<p class="kicker">You have landed at ' + course.place + '</p>' +
        '<div class="hero-row">' +
          '<div class="medal">' + atlas.icon(course.icon) + '</div>' +
          '<div><h1 id="title"></h1><ul class="chips" id="chips"></ul></div>' +
        '</div>' +
      '</div>' +
    '</header>' +
    '<div class="wrap">' +
      '<p class="lead" id="lead"></p>' +
      '<h2>Who it is for</h2><p class="audience" id="audience"></p>' +
      '<h2>What you practice</h2><ul class="practice" id="practice"></ul>' +
      '<h2>Session shape</h2><div id="sessions"></div>' +
      '<div class="cta"><a class="primary" href="index.html#contact">Talk about running this</a></div>' +
      '<p class="demo-note">Demo outline — the live session is built around your team’s real meetings.</p>' +
      '<div class="next"><p class="kicker">Next stop</p><a id="next" href=""></a></div>' +
    '</div>';

  document.getElementById("title").textContent = course.name;
  document.getElementById("lead").textContent = course.summary;
  document.getElementById("audience").textContent = course.audience;
  document.getElementById("next").textContent = next.name;
  document.getElementById("next").href = "course.html?id=" + next.id;

  var chips = document.getElementById("chips");
  [course.duration, course.format, course.group].forEach(function (label) {
    var li = document.createElement("li");
    li.textContent = label;
    chips.appendChild(li);
  });

  var practice = document.getElementById("practice");
  course.practice.forEach(function (item) {
    var li = document.createElement("li");
    li.textContent = item;
    practice.appendChild(li);
  });

  var sessions = document.getElementById("sessions");
  course.sessions.forEach(function (session, i) {
    var row = document.createElement("article");
    row.className = "session";
    var num = document.createElement("div");
    num.className = "session-num";
    num.textContent = String(i + 1).padStart(2, "0");
    var body = document.createElement("div");
    var h = document.createElement("h3");
    h.textContent = session.title;
    var p = document.createElement("p");
    p.textContent = session.text;
    body.appendChild(h);
    body.appendChild(p);
    row.appendChild(num);
    row.appendChild(body);
    sessions.appendChild(row);
  });
})();
</script>
</body>
</html>
